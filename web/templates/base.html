<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Vido Tunnel{{end}}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body>
    {{if .Authenticated}}
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center fw-bold text-primary me-4" href="/">
                <i class="bi bi-shield-lock-fill fs-4 me-2 text-primary"></i>
                <span class="text-light">VIDO</span><span class="text-primary ms-1">TUNNEL</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {{if eq .ActiveNav "explorer"}}active text-primary fw-semibold{{else}}text-light-50{{end}}" href="/">
                            <i class="bi bi-folder2-open me-1"></i> File Explorer
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{if eq .ActiveNav "control"}}active text-primary fw-semibold{{else}}text-light-50{{end}}" href="/control">
                            <i class="bi bi-cpu-fill me-1"></i> Control Panel
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-dark-subtle text-muted border border-secondary-subtle px-3 py-2 d-none d-md-inline-block" title="Scoped Root Directory">
                        <i class="bi bi-hdd-fill me-1 text-info"></i> {{.RootDir}}
                    </span>
                    <form method="POST" action="/logout" class="d-inline m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm px-3">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
    {{end}}

    <main class="py-4">
        <div class="container-fluid px-4">
            {{block "content" .}}{{end}}
        </div>
    </main>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    {{block "scripts" .}}{{end}}
</body>
</html>
